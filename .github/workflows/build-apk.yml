name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Sửa lỗi: Cấp quyền thực thi cho file gradlew trước khi chạy build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Sửa lỗi: Chạy lệnh build bằng ./gradlew chuẩn Linux
      - name: Build APK
        run: ./gradlew assembleDebug

      # Kiểm tra và tải file APK lên (Đường dẫn mặc định của các dự án Android)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Ringtone-Studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
